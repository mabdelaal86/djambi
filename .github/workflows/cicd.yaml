name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    types: [ opened, reopened, synchronize ]

defaults:
  run:
    working-directory: flutter

jobs:
  # linting stages
  analyze:
    name: Analyze Source Code
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v7
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          cache: true
      - name: Report Flutter version
        run: flutter --version
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze source code
        run: flutter analyze --no-pub
      - name: Check source code format
        run: dart format -o none --set-exit-if-changed .

  # building stages
  build_linux_web:
    name: Build Linux and Web
    runs-on: ubuntu-latest
    needs: [analyze]
    steps:
      - name: Clone repository
        uses: actions/checkout@v7
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          cache: true
      - name: Report Flutter version
        run: flutter --version
      - name: Install system dependencies
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -yq --no-install-recommends \
            build-essential \
            libgtk-3-dev \
            ;
      - name: Install dependencies
        run: flutter pub get
      - name: Build Linux
        run: flutter build linux --no-pub
      - name: Build Web
        run: flutter build web --no-pub

  build_android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: [analyze]
    steps:
      - name: Clone repository
        uses: actions/checkout@v7
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          cache: true
      - name: Report Flutter version
        run: flutter --version
      - name: Install dependencies
        run: flutter pub get
      - name: Create Keys
        run: |
          # create a key properties file for testing
          echo "keyAlias=testAlias" >> android/key.properties
          echo "keyPassword=testPass" >> android/key.properties
          echo "storePassword=testPass" >> android/key.properties
          echo "storeFile=${{github.workspace}}/flutter/test.keystore" >> android/key.properties
          cat android/key.properties
          # create a test keystore file
          keytool -genkeypair -v -keyalg RSA -keysize 2048 -validity 10000 \
            -alias testAlias -keypass testPass -storepass testPass -keystore test.keystore \
            -dname "CN=Test, OU=Dev, O=TestCorp, L=City, S=State, C=US"
          pwd && ls -la
      - name: Build Android
        run: flutter build apk --no-pub
      - name: Build App Bundle
        run: flutter build appbundle --no-pub
