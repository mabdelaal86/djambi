name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    types: [ opened, reopened, synchronize ]

jobs:
  # linting stages
  analyze:
    name: Analyze Source Code
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
      - name: Report Flutter version
        run: flutter --version
      - name: Install dependencies
        run: flutter pub get --directory ./flutter
      - name: Analyze source code
        run: flutter analyze --no-pub ./flutter
      - name: Check source code format
        run: dart format -o none --set-exit-if-changed ./flutter

  # building stages
  build_linux:
    name: Build Linux
    runs-on: ubuntu-latest
    needs: [analyze]
    steps:
      - name: Install Linux packages
        run: |
          sudo apt-get update
          sudo apt-get install -yq --no-install-recommends \
            build-essential libgtk-3-dev
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
      - name: Report Flutter version
        run: flutter --version
      - name: Install dependencies
        run: flutter pub get
        working-directory: ./flutter
      - name: Build Linux
        run: flutter build linux --no-pub
        working-directory: ./flutter
